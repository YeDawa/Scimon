[package]
name = "Scimon"
version = "0.1.0"
license = "MIT"
edition = "2021"
authors = [ "kremilly" ]
categories = ["command-line-utilities"]
keywords = ["pdf batch", "batch downloads", "markdown to pdf", "pdf downloader", "markdown converter"]
description = "Scimon is a tool designed for batch downloading PDF files using its own dedicated language, Monset (.mon). Monset features a very simple and quick-to-write syntax, making it easy to use."
repository = "https://github.com/YeDawa/Scimon"
documentation = "https://scimon.dev"
homepage = "https://scimon.dev"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
reqwest = { version = "0.13.4", features = ["multipart", "json", "blocking"] }
tokio = { version = "1.43.0", features = ["full"] }
futures = "0.3.31"
url = "2.5.8"
is-url = "1.0.4"
mime = "0.3.13"
dotenvy = "0.15.7"
figlet-rs = "1.0.0"
colored = "3.0.0"
dirs-next = "2.0"
clap = { version = "4.6.1", features = ["cargo", "derive"] }
indicatif = "0.18.4"
regex = "1.12.3"
once_cell = "1.21.4"
chrono = "0.4.45"
serde_json = "1.0.150"
serde = { version = "1.0.228", features = ["derive"] }
webbrowser = "1.2.1"
pulldown-cmark = "0.13.4"
qrcode = "0.14.0"
base64 = "0.22.1"
serde_yaml = "0.9"
minify = "1.3.0"
image = "0.25.10"
select = "0.6.1"
headless_chrome = "1.0.21"
rand = "0.10.1"
open = "5.3.5"
lopdf = "0.34.0"
sha2 = "0.11.0"
zip = "8.6.0"
walkdir = "2.5.0"
scraper = "0.27.0"
pdfium-render = "0.9.1"
rpassword = "7.5.4"
mathjax = "0.1.1"
urlencoding = "2.1.3"
flate2 = "1.1.9"
tar = "0.4.46"
ureq = "3.3.0"
